<style>
  :root {
    --azul: #1a3c6e;
    --azul-claro: #2f5aa0;
    --vermelho: #d63b3b;
    --verde: #2e9e5b;
    --amarelo: #e0a52c;
    --cinza-bg: #f4f6f9;
    --cinza-borda: #dfe3e8;
    --texto: #1f2937;
    --texto-suave: #6b7280;
    --branco: #ffffff;
    --raio: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--cinza-bg);
    color: var(--texto);
    padding-bottom: 76px;
  }

  h1 { font-size: 20px; margin: 4px 0 16px; color: var(--azul); }
  h2 { font-size: 15px; margin: 20px 0 10px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.03em; }

  .content { padding: 16px; max-width: 640px; margin: 0 auto; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein 0.15s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Tabbar inferior (mobile-first) ---------- */
  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--branco);
    border-top: 1px solid var(--cinza-borda);
    display: flex;
    z-index: 100;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
  }
  .tab-btn {
    flex: 1;
    background: none; border: none;
    padding: 10px 4px 8px;
    font-size: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--texto-suave);
    cursor: pointer;
  }
  .tab-btn span { font-size: 11px; }
  .tab-btn.active { color: var(--azul); font-weight: 600; }

  /* ---------- Cards de estatística ---------- */
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
  }
  .stat-card {
    background: var(--branco);
    border-radius: var(--raio);
    padding: 14px;
    text-align: center;
    border: 1px solid var(--cinza-borda);
  }
  .stat-card.urgente { border-color: var(--vermelho); }
  .stat-card.urgente .stat-num { color: var(--vermelho); }
  .stat-card.alerta { border-color: var(--amarelo); }
  .stat-card.alerta .stat-num { color: var(--amarelo); }
  .stat-card.ok .stat-num { color: var(--verde); }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--azul); }
  .stat-label { font-size: 12px; color: var(--texto-suave); margin-top: 4px; }

  /* ---------- Cards de lista ---------- */
  .cards-list { display: flex; flex-direction: column; gap: 8px; }
  .item-card {
    background: var(--branco);
    border-radius: var(--raio);
    padding: 12px 14px;
    border: 1px solid var(--cinza-borda);
    border-left: 4px solid var(--azul-claro);
    cursor: pointer;
  }
  .item-card.urgente { border-left-color: var(--vermelho); background: #fff5f5; }
  .item-card.alerta { border-left-color: var(--amarelo); }
  .item-card .linha-topo { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .item-card .sub { font-size: 12.5px; color: var(--texto-suave); margin-top: 4px; }
  .badge { font-size: 10.5px; padding: 2px 8px; border-radius: 20px; background: var(--cinza-bg); color: var(--texto-suave); }
  .badge.urgente { background: var(--vermelho); color: #fff; }
  .badge.alerta { background: var(--amarelo); color: #fff; }
  .badge.ok { background: var(--verde); color: #fff; }
  .empty-msg { color: var(--texto-suave); font-size: 13px; padding: 12px 0; text-align: center; }

  .item-card.selecionavel { cursor: pointer; transition: 0.1s; }
  .item-card.selecionado { border: 2px solid var(--azul); background: #eef3fc; }

  /* ---------- Formulários ---------- */
  form { display: flex; flex-direction: column; }
  label { font-size: 12.5px; font-weight: 600; color: var(--texto-suave); margin: 12px 0 4px; }
  input[type=text], input[type=search] {
    padding: 12px 14px;
    border-radius: var(--raio);
    border: 1px solid var(--cinza-borda);
    font-size: 15px;
    background: var(--branco);
  }
  input:focus { outline: 2px solid var(--azul-claro); border-color: transparent; }

  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .rodo-frotas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rodo-frotas-grid input { padding: 10px 12px; border-radius: var(--raio); border: 1px solid var(--cinza-borda); font-size: 14px; }
  .checkbox-group label.chip {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--texto);
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .checkbox-group input[type=checkbox] { accent-color: var(--azul); }
  .checkbox-group label.chip.marcado { background: var(--azul); color: #fff; border-color: var(--azul); }

  .toggle-label { display: flex; align-items: center; gap: 8px; margin-top: 16px; cursor: pointer; }
  .toggle-label input { width: 20px; height: 20px; accent-color: var(--vermelho); }
  .toggle-text { font-size: 14px; font-weight: 600; }

  .nf-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .nf-row input { flex: 1; }
  .nf-row button { background: none; border: none; color: var(--vermelho); font-size: 18px; cursor: pointer; }

  button { font-family: inherit; }
  .btn-primary {
    margin-top: 20px;
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: var(--raio);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:disabled { background: #a9b6c9; cursor: not-allowed; }
  .btn-secondary {
    background: var(--branco);
    color: var(--azul);
    border: 1.5px solid var(--azul);
    padding: 10px 14px;
    border-radius: var(--raio);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .hint { color: var(--texto-suave); font-size: 13px; margin-bottom: 12px; }
  .small { font-size: 11.5px; }

  .hidden { display: none !important; }

  .email-box {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: var(--raio);
    padding: 14px;
    margin-top: 12px;
  }
  .email-box pre {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 13.5px;
    background: var(--cinza-bg);
    padding: 10px;
    border-radius: 8px;
    margin-top: 8px;
  }
  .botoes-confirmacao { display: flex; gap: 8px; margin-top: 12px; }
  .botoes-confirmacao button { flex: 1; }

  .search-input { width: 100%; margin-bottom: 12px; }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 200;
  }
  .modal-box {
    background: var(--branco);
    border-radius: 16px 16px 0 0;
    padding: 20px;
    width: 100%; max-width: 640px;
    max-height: 80vh; overflow-y: auto;
    position: relative;
  }
  .modal-fechar {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; font-size: 18px; cursor: pointer; color: var(--texto-suave);
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--texto); color: #fff;
    padding: 10px 18px; border-radius: 30px;
    font-size: 13.5px; z-index: 300;
    max-width: 90%; text-align: center;
  }
  .toast.erro { background: var(--vermelho); }
  .toast.sucesso { background: var(--verde); }

  /* Desktop: centraliza um pouco mais e tabbar vira topo fixo opcionalmente igual */
  @media (min-width: 700px) {
    .content { padding: 24px; }
  }
</style>
