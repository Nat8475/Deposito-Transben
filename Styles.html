<style id="cdv-styles">
/* ══════════════════════════════════════════════════
   DESIGN SYSTEM v12 — Styles.html (parcial GAS)
   Injetado automaticamente em todas as páginas pelo
   servidor (_injetarDesignSystem_ em Código.gs).
   Os tokens abaixo SOBRESCREVEM os blocos cdv-v10
   locais de cada form (mesma especificidade, vem depois).
══════════════════════════════════════════════════ */

/* === TOKENS === */
:root {
  /* fonts */
  --font : 'Plus Jakarta Sans', system-ui, sans-serif;
  --mono : 'JetBrains Mono', ui-monospace, monospace;

  /* brand — Swiss professional: navy profundo + azul de ação */
  --ink        : #0B1526;
  --navy       : #2563EB;
  --navy-800   : #1E40AF;
  --navy-d     : #1D4ED8;
  --navy-deep  : #1E3A5F;
  --teal       : #0E7490;
  --red        : #DC2626;
  --green      : #059669;
  --amber      : #D97706;
  --brand-amber: #E8A020;
  --brand-red  : #DC2626;

  /* surfaces */
  --bg        : #F4F6FB;
  --surface   : #FFFFFF;
  --input-bg  : #F8FAFD;
  --slate-50  : #F8FAFD;
  --slate-100 : #EEF2F9;
  --navy-50   : #EFF4FF;
  --green-bg  : #ECFDF5;
  --red-bg    : #FEF2F2;
  --amber-bg  : #FFFBEB;

  /* borders */
  --border    : #E3E8F2;
  --border-def: #C9D4E5;

  /* text */
  --text      : #101828;
  --text-body : #344256;
  --text-muted: #5B7186;
  --text-faint: #93A6BC;
  --text-sm   : var(--text-muted);
  --c-hdr     : var(--navy);

  /* radius */
  --r    : 12px;
  --r-sm : 9px;
  --r-xs : 6px;
  --r-md : 14px;
  --r-lg : 18px;

  /* shadows */
  --sh    : 0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.06);
  --sh-xs : 0 1px 2px rgba(16,24,40,.05);
  --sh-sm : var(--sh);
  --sh-md : 0 4px 12px rgba(16,24,40,.08), 0 10px 28px rgba(16,24,40,.08);
  --sh-lg : 0 12px 32px rgba(16,24,40,.14), 0 24px 60px rgba(16,24,40,.10);

  /* ease */
  --ease        : cubic-bezier(.4,0,.2,1);
  --ease-spring : cubic-bezier(.34,1.56,.64,1);
  --ease-smooth : cubic-bezier(.25,.46,.45,.94);
  --ease-out    : cubic-bezier(.16,1,.3,1);
  --ease-bounce : cubic-bezier(.68,-0.55,.27,1.55);

  /* durations */
  --dur-fast  : 120ms;
  --dur-base  : 200ms;
  --dur-slow  : 320ms;
  --dur-enter : 260ms;

  /* glow / focus */
  --glow-navy  : 0 0 0 3px rgba(37,99,235,.20), 0 4px 20px rgba(37,99,235,.25);
  --glow-green : 0 0 0 3px rgba(5,150,105,.18), 0 4px 18px rgba(5,150,105,.22);
  --glow-red   : 0 0 0 3px rgba(220,38,38,.16), 0 4px 18px rgba(220,38,38,.20);
  --glow-amber : 0 0 0 3px rgba(217,119,6,.16), 0 4px 18px rgba(217,119,6,.20);
  --glow-cyan  : 0 0 0 3px rgba(14,116,144,.16), 0 4px 18px rgba(14,116,144,.20);
  --sh-navy    : 0 4px 20px rgba(37,99,235,.30), 0 2px 8px rgba(37,99,235,.16);

  /* gradients */
  --grad-primary : linear-gradient(135deg, #3B76F6 0%, #2563EB 55%, #1E40AF 100%);
  --grad-hero    : linear-gradient(135deg, #0B1526 0%, #1E3A5F 100%);
}

/* === DARK MODE === */
body.dark {
  --bg        : #0A0F1A;
  --surface   : #101828;
  --input-bg  : #0C1322;
  --border    : #1E293B;
  --border-def: #2B3B52;
  --text      : #EAF1FB;
  --text-body : #A9BDD6;
  --text-muted: #64809C;
  --text-faint: #33475E;
  --navy-50   : #14233C;
  --slate-50  : #0D1626;
  --slate-100 : #16233A;
  --green-bg  : #052E20;
  --red-bg    : #2C0D0D;
  --amber-bg  : #241503;
  --sh    : 0 1px 3px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.28);
  --sh-md : 0 6px 22px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.30);
  --sh-lg : 0 16px 44px rgba(0,0,0,.60), 0 6px 12px rgba(0,0,0,.40);
  --glow-navy : 0 0 0 3px rgba(59,118,246,.26), 0 4px 22px rgba(59,118,246,.32);
  --sh-navy   : 0 4px 22px rgba(59,118,246,.38), 0 2px 8px rgba(59,118,246,.22);
}
body {
  background:var(--bg); color:var(--text); font-family:var(--font);
  transition:background .22s,color .22s;
  -webkit-font-smoothing:antialiased;
  animation:pageIn var(--dur-enter) var(--ease-out) both;
}

/* === KEYFRAMES === */
/* pageIn NÃO pode ter transform: com fill "both" o body fica com transform
   residual e vira containing block — todo position:fixed (modais, toasts,
   menus) passa a ancorar no body em vez do viewport. Só opacity. */
@keyframes pageIn      { from{opacity:0} to{opacity:1} }
@keyframes fadeUp      { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn      { from{opacity:0} to{opacity:1} }
@keyframes scaleIn     { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
@keyframes shimmer     { 0%{background-position:-600px 0} 100%{background-position:600px 0} }
@keyframes spin        { to{transform:rotate(360deg)} }
@keyframes pulseDot    { 0%,100%{box-shadow:0 0 0 0 currentColor;opacity:.9} 60%{box-shadow:0 0 0 5px transparent;opacity:0} }
@keyframes slideUp     { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes kpiIn       { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes ripple      { from{transform:scale(0);opacity:.35} to{transform:scale(4);opacity:0} }
@keyframes popIn       { from{opacity:0;transform:scale(.92) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes popOut      { from{opacity:1;transform:scale(1) translateY(0)} to{opacity:0;transform:scale(.94) translateY(4px)} }
@keyframes slideRight  { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideOutRight { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(20px)} }
@keyframes rowIn       { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
@keyframes drainBar    { from{width:100%} to{width:0} }
@keyframes shineBeam   { from{transform:skewX(-20deg) translateX(-100%)} to{transform:skewX(-20deg) translateX(900%)} }

/* === SCROLLBAR === */
::-webkit-scrollbar { width:7px;height:7px }
::-webkit-scrollbar-track { background:transparent }
::-webkit-scrollbar-thumb { background:var(--border-def);border-radius:8px }
::-webkit-scrollbar-thumb:hover { background:var(--text-faint) }

/* === HEADER PADRÃO (.titulo usado em vários forms) === */
.titulo {
  background:var(--grad-hero) !important;
  color:#fff;
  border-radius:var(--r-sm);
  box-shadow:0 4px 16px rgba(11,21,38,.28);
  position:relative; overflow:hidden;
  animation:fadeUp var(--dur-enter) var(--ease-out) both;
}
.titulo::after {
  content:'';position:absolute;top:0;bottom:0;width:60px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  transform:skewX(-20deg) translateX(-100%);
  animation:shineBeam 2.4s var(--ease-smooth) .4s 1;
  pointer-events:none;
}

/* === BOTÕES — sistema unificado === */
.btn,.bsm {
  display:inline-flex;align-items:center;gap:6px;
  padding:0 14px;height:34px;
  border-radius:var(--r-sm);border:none;cursor:pointer;
  font:600 12px/1 var(--font);font-family:var(--font);
  text-decoration:none;white-space:nowrap;
  transition:transform var(--dur-fast) var(--ease),
             box-shadow var(--dur-base) var(--ease-smooth),
             filter var(--dur-base),
             background var(--dur-base),
             opacity var(--dur-fast);
  position:relative;overflow:hidden;
}
.btn:active   { transform:translateY(0) scale(.97) !important;transition-duration:var(--dur-fast) }
.btn:focus-visible { outline:2px solid var(--navy);outline-offset:2px }
.btn:disabled,.bsm:disabled { opacity:.45;cursor:not-allowed;pointer-events:none }
/* ripple pseudo-element */
.btn::after {
  content:'';position:absolute;border-radius:50%;
  width:100px;height:100px;background:rgba(255,255,255,.25);
  transform:scale(0);opacity:0;pointer-events:none;
  left:var(--rx,50%);top:var(--ry,50%);translate:-50% -50%;
}
.btn.rippling::after { animation:ripple 500ms var(--ease-smooth) forwards }
/* tamanhos */
.btn-lg  { height:40px;padding:0 20px;font-size:13px }
.btn-sm  { height:28px;padding:0 10px;font-size:11px }
.btn-xs  { height:24px;padding:0 8px;font-size:10.5px }
.btn-blk { width:100%;justify-content:center }

/* variantes */
.btn-pri,.bprim,.btn-prim,.btn-primary {
  background:var(--grad-primary);color:#fff;
  box-shadow:0 2px 10px rgba(37,99,235,.25);
}
.btn-pri:hover,.bprim:hover,.btn-prim:hover,.btn-primary:hover {
  transform:translateY(-1px);box-shadow:var(--sh-navy);filter:brightness(1.06);
}

.btn-sec,.btn-gray,.bgray,.btn-outline {
  background:var(--surface);border:1px solid var(--border-def);color:var(--text-body);
}
.btn-sec:hover,.btn-gray:hover,.bgray:hover,.btn-outline:hover {
  background:var(--slate-100);border-color:var(--navy);
}

.btn-succ,.bgreen,.btn-green,.btn-success {
  background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(5,150,105,.20);
}
.btn-succ:hover,.bgreen:hover,.btn-green:hover,.btn-success:hover {
  transform:translateY(-1px);filter:brightness(1.06);box-shadow:var(--glow-green);
}

.btn-danger,.bred,.btn-red {
  background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(220,38,38,.20);
}
.btn-danger:hover,.bred:hover,.btn-red:hover {
  transform:translateY(-1px);filter:brightness(1.06);box-shadow:var(--glow-red);
}

.btn-orange,.bamber,.btn-amber {
  background:var(--amber);color:#fff;box-shadow:0 2px 8px rgba(217,119,6,.20);
}
.btn-orange:hover,.bamber:hover,.btn-amber:hover {
  transform:translateY(-1px);filter:brightness(1.06);box-shadow:var(--glow-amber);
}

.btn-cyan,.bcyan,.btn-teal {
  background:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(14,116,144,.20);
}
.btn-cyan:hover,.bcyan:hover,.btn-teal:hover {
  transform:translateY(-1px);filter:brightness(1.06);box-shadow:var(--glow-cyan);
}

.btn-ghost,.btn-gho {
  background:transparent;color:var(--text-muted);border:none;
}
.btn-ghost:hover,.btn-gho:hover { background:var(--slate-100);color:var(--text-body) }

/* botões no header escuro (pg-top / pghdr) */
.btn-hdr { background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25) }
.btn-hdr:hover { background:rgba(255,255,255,.26) }

/* micro-interação genérica p/ <button> sem classe */
button { transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-base), opacity var(--dur-fast), background var(--dur-base), border-color var(--dur-base), color var(--dur-base) }
button:active:not(:disabled) { transform:scale(.98) }
button:focus-visible { outline:2px solid var(--navy);outline-offset:2px }

/* === INPUTS === */
input:not([type=checkbox]):not([type=radio]):not([type=range]),
select, textarea {
  font-family:var(--font);
  transition:border-color var(--dur-base),
             box-shadow var(--dur-base),
             background var(--dur-base),
             transform var(--dur-fast);
}
input:not([type=checkbox]):not([type=radio]):hover:not(:focus),
select:hover:not(:focus) {
  background:var(--surface);
}
input:not([type=checkbox]):not([type=radio]):focus,
select:focus, textarea:focus {
  border-color:var(--navy) !important;
  box-shadow:0 0 0 3px rgba(37,99,235,.14),0 1px 4px rgba(37,99,235,.10) !important;
  background:var(--surface) !important;
  transform:translateY(-0.5px);
  outline:none !important;
}
::placeholder { color:var(--text-faint) }

/* === TABELAS === */
thead th {
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
tbody tr {
  transition:background var(--dur-fast);
  position:relative;
}
/* NÃO usar tr::before/::after: pseudo em <tr> vira célula anônima no Chrome
   e desloca todas as colunas do tbody em relação ao thead. */
tbody tr:hover td:first-child { box-shadow:inset 3px 0 0 0 var(--navy) }
/* badge brightens on row hover */
tbody tr:hover .bdg,
tbody tr:hover .badge { filter:brightness(1.05) saturate(1.1) }

/* skeleton */
.sk {
  background:linear-gradient(90deg,var(--slate-100) 25%,var(--surface) 50%,var(--slate-100) 75%);
  background-size:600px 100%;animation:shimmer 1.1s infinite;border-radius:6px;
}
.sk-row td { padding:10px !important }

/* === CARDS genéricos === */
.card, .kpi {
  transition:box-shadow var(--dur-base) var(--ease-smooth),
             transform var(--dur-base) var(--ease-smooth),
             border-color var(--dur-base);
}
.card:hover { box-shadow:var(--sh-md) }

/* stagger de entrada: containers com data-stagger animam filhos */
[data-stagger] > * { animation:fadeUp var(--dur-enter) var(--ease-out) both }
[data-stagger] > *:nth-child(1) { animation-delay:.03s }
[data-stagger] > *:nth-child(2) { animation-delay:.08s }
[data-stagger] > *:nth-child(3) { animation-delay:.13s }
[data-stagger] > *:nth-child(4) { animation-delay:.18s }
[data-stagger] > *:nth-child(5) { animation-delay:.23s }
[data-stagger] > *:nth-child(6) { animation-delay:.28s }
[data-stagger] > *:nth-child(n+7) { animation-delay:.32s }

/* === MODAIS === */
.overlay,.ov {
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  animation:fadeIn var(--dur-base) var(--ease);
}
.modal-box,.mb { animation:popIn var(--dur-enter) var(--ease-spring) }

/* === TOASTS === */
#toast-root {
  position:fixed;bottom:24px;right:24px;z-index:9998;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.tst {
  display:flex;align-items:center;gap:10px;
  padding:11px 16px;border-radius:var(--r-sm);
  font:500 12.5px/1.4 var(--font);color:#fff;
  box-shadow:var(--sh-lg);pointer-events:all;
  animation:slideRight var(--dur-enter) var(--ease-spring);
  max-width:340px;position:relative;overflow:hidden;
}
.tst.out { animation:slideOutRight var(--dur-base) var(--ease-smooth) forwards }
.tst::after {
  content:'';position:absolute;bottom:0;left:0;
  height:3px;background:rgba(255,255,255,.35);
  animation:drainBar linear forwards;
  animation-duration:var(--toast-duration,4s);
}
.tst-ok   { background:#059669 }
.tst-err  { background:#DC2626 }
.tst-warn { background:#D97706 }
.tst-info { background:#0E7490 }

/* === FILTER BAR === */
.filter-bar,.filts {
  transition:max-height var(--dur-slow) var(--ease-smooth),
             padding var(--dur-slow) var(--ease-smooth),
             opacity var(--dur-base);
}
.filter-bar.minimizado {
  max-height:0;padding-top:0;padding-bottom:0;
  border-bottom:none;opacity:0;overflow:hidden;
}

/* === SPINNER === */
.spin-ring,.spin-sm {
  display:inline-block;width:18px;height:18px;border-radius:50%;
  border:2px solid var(--border-def);border-top-color:var(--navy);
  animation:spin .7s linear infinite;vertical-align:middle;
}

/* === ACESSIBILIDADE === */
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
<script>
/* ── countUp: anima número KPI de 0 até o valor ── */
function countUp(el, to, duration) {
  duration = duration || 600;
  var start = performance.now();
  var suffix = el.dataset.suffix || '';
  function tick(now) {
    var p = Math.min((now - start) / duration, 1);
    var ease = 1 - Math.pow(1 - p, 3); // easeOutCubic
    el.textContent = Math.round(to * ease) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function initKpiCounters() {
  document.querySelectorAll('[data-kpi-val]').forEach(function(el) {
    countUp(el, parseInt(el.dataset.kpiVal, 10));
  });
}

/* ── initRipple: adiciona efeito ripple nos botões primários ── */
function initRipple(scope) {
  var sel = '.btn-pri,.bprim,.btn-prim,.btn-primary,.btn-succ,.bgreen,.btn-green,.btn-success,.btn-danger,.bred,.btn-red,.btn-orange,.bamber,.btn-amber,.btn-cyan,.bcyan,.btn-teal';
  (scope || document).querySelectorAll(sel).forEach(function(btn) {
    if (btn._ripple) return;
    btn._ripple = true;
    btn.addEventListener('click', function(e) {
      var r = btn.getBoundingClientRect();
      btn.style.setProperty('--rx', (e.clientX - r.left) + 'px');
      btn.style.setProperty('--ry', (e.clientY - r.top) + 'px');
      btn.classList.remove('rippling');
      void btn.offsetWidth; // reflow
      btn.classList.add('rippling');
      setTimeout(function() { btn.classList.remove('rippling'); }, 500);
    });
  });
}

/* ── showToast: sistema centralizado de notificações ── */
function showToast(msg, type, duration) {
  type = type || 'ok';
  duration = duration || 4000;
  var root = document.getElementById('toast-root');
  if (!root) {
    root = document.createElement('div');
    root.id = 'toast-root';
    document.body.appendChild(root);
  }
  var t = document.createElement('div');
  t.className = 'tst tst-' + type;
  t.style.setProperty('--toast-duration', (duration / 1000) + 's');
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(function() {
    t.classList.add('out');
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
}

/* ── closeModalAnimated: fecha modal com animação popOut ── */
function closeModalAnimated(el) {
  var box = el.querySelector ? el.querySelector('.modal-box,.mb') : null;
  if (box) {
    var dur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dur-base')) || 200;
    box.style.animation = 'popOut ' + dur + 'ms var(--ease-smooth) forwards';
    setTimeout(function() {
      el.style.display = 'none';
      box.style.animation = '';
    }, dur + 20);
  } else {
    el.style.display = 'none';
  }
}

/* ── Auto-init ao carregar ── */
document.addEventListener('DOMContentLoaded', function() {
  initRipple();
});
</script>

<style>
/* ════════════════════════════════════════════════════════════
   REDESIGN 2026 — camada de componentes compartilhados (rd-*)
   Prefixo rd- evita colisão com classes locais dos forms.
   Fonte de verdade: aprovado na pasta redesign/ (galeria).
   ════════════════════════════════════════════════════════════ */
:root{--rd-spring:cubic-bezier(.34,1.56,.64,1);--rd-grad-btn:linear-gradient(135deg,#3B76F6,#2563EB 55%,#1E40AF)}
@keyframes rdCheckPop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ── Hero ── */
.rd-hero{background:var(--grad-hero);border-radius:var(--r);color:#fff;padding:16px 18px;margin-bottom:14px;
  position:relative;overflow:hidden;box-shadow:0 6px 22px rgba(11,21,38,.30);animation:fadeUp .35s var(--ease-out) both}
.rd-hero::after{content:'';position:absolute;right:-70px;top:-70px;width:210px;height:210px;
  background:radial-gradient(circle,rgba(59,118,246,.35),transparent 70%);pointer-events:none}
.rd-hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.rd-hero h1{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0}
.rd-hero .rd-sub{font-size:11px;color:#8FA6C8;margin-top:3px}
.rd-hero-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rd-ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.92);
  border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);
  transition:background .18s,transform .15s}
.rd-ghost:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}

/* ── Cards numerados ── */
.rd-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);margin-bottom:12px;
  box-shadow:var(--sh);overflow:hidden;transition:border-color .2s,box-shadow .2s;animation:fadeUp .35s var(--ease-out) both}
.rd-card:focus-within{border-color:rgba(37,99,235,.45);box-shadow:0 4px 18px rgba(37,99,235,.10)}
.rd-card-head{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--border)}
.rd-num{width:24px;height:24px;border-radius:8px;background:var(--navy-50);color:var(--navy);font-size:11.5px;
  font-weight:800;display:grid;place-items:center;flex-shrink:0}
.rd-card-head h2{font-size:12.5px;font-weight:800;color:var(--text);flex:1;margin:0}
.rd-card-head .rd-tag{font-size:9.5px;font-weight:700;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase}
.rd-card-body{padding:13px 15px}

/* ── Segmented ── */
.rd-seg{display:flex;background:var(--surface);border:1.5px solid var(--border-def);border-radius:99px;padding:5px;
  margin-bottom:14px;position:relative;box-shadow:var(--sh);animation:fadeUp .35s .05s var(--ease-out) both}
.rd-seg-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);background:var(--rd-grad-btn);
  border-radius:99px;box-shadow:0 3px 10px rgba(37,99,235,.35);transition:transform .3s var(--rd-spring)}
.rd-seg.p1 .rd-seg-ind{transform:translateX(100%)}
.rd-seg button{flex:1;position:relative;z-index:1;background:none;border:none;padding:9px;font-family:var(--font);
  font-size:12.5px;font-weight:700;color:var(--text-muted);cursor:pointer;border-radius:99px;transition:color .25s}
.rd-seg button.on{color:#fff}

/* ── Chips ── */
.rd-chips{display:flex;gap:7px;flex-wrap:wrap}
.rd-chip{flex:1;min-width:86px;border:1.5px solid var(--border-def);border-radius:var(--r-sm);background:var(--input-bg);
  padding:8px 10px;cursor:pointer;text-align:center;font-family:var(--font);font-size:12px;font-weight:700;
  color:var(--text-muted);transition:border-color .18s,background .18s,color .18s,transform .12s}
.rd-chip:hover{transform:translateY(-1px)}
.rd-chip:active{transform:scale(.97)}
.rd-chip.on-falta{border-color:#93C5FD;background:var(--navy-50);color:var(--navy)}
.rd-chip.on-avaria{border-color:#FCD34D;background:var(--amber-bg);color:#B45309}
.rd-chip.on-rejeicao{border-color:#FCA5A5;background:var(--red-bg);color:var(--red)}
body.dark .rd-chip.on-avaria{color:#FCD34D}
body.dark .rd-chip.on-rejeicao{color:#FCA5A5}

/* ── Pills de status ── */
.rd-pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:10.5px;
  font-weight:700;border:1px solid;white-space:nowrap}
.rd-pill.azul{background:var(--navy-50);color:var(--navy);border-color:#BFDBFE}
.rd-pill.verde{background:var(--green-bg);color:#166534;border-color:#BBF7D0}
.rd-pill.ambar{background:var(--amber-bg);color:#B45309;border-color:#FDE68A}
.rd-pill.verm{background:var(--red-bg);color:var(--red);border-color:#FECACA}
.rd-pill.cinza{background:var(--slate-100);color:var(--text-muted);border-color:var(--border-def)}
body.dark .rd-pill.azul{border-color:#1E3A8A}
body.dark .rd-pill.verde{color:#4ADE80;border-color:#14532D}
body.dark .rd-pill.ambar{color:#FCD34D;border-color:#78350F}
body.dark .rd-pill.verm{color:#FCA5A5;border-color:#7F1D1D}

/* ── Botões principais ── */
.rd-btn{flex:1;padding:11px;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:800;cursor:pointer;
  font-family:var(--font);background:var(--rd-grad-btn);color:#fff;display:flex;align-items:center;justify-content:center;
  gap:8px;box-shadow:0 3px 12px rgba(37,99,235,.32);transition:opacity .18s,box-shadow .18s,transform .15s}
.rd-btn:hover{box-shadow:0 6px 18px rgba(37,99,235,.45);transform:translateY(-1px)}
.rd-btn:active{transform:scale(.985)}
.rd-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.rd-btn .rd-spin{width:14px;height:14px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:99px;animation:spin .7s linear infinite;display:none;flex-shrink:0}
.rd-btn.loading .rd-spin{display:block}
.rd-btn.verde{background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 3px 12px rgba(5,150,105,.32)}
.rd-btn.verm{background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 3px 12px rgba(220,38,38,.32)}
.rd-btn.ambar{background:linear-gradient(135deg,#F59E0B,#B45309);box-shadow:0 3px 12px rgba(217,119,6,.32)}
.rd-sec{flex:1;padding:11px;border:1.5px solid var(--border-def);border-radius:var(--r-sm);font-size:13px;
  font-weight:700;cursor:pointer;font-family:var(--font);background:var(--surface);color:var(--text-body);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:background .18s,border-color .18s,transform .15s}
.rd-sec:hover{background:var(--slate-100);border-color:var(--text-faint);transform:translateY(-1px)}
.rd-acoes{display:flex;gap:9px;margin-top:4px}

/* ── Wizard: trilho lateral + passos verticais + resumo ── */
.rd-wz{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:start}
@media(max-width:720px){.rd-wz{grid-template-columns:1fr}}
.rd-rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .35s .05s var(--ease-out) both}
@media(max-width:720px){.rd-rail{position:static}}
.rd-vsteps{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.rd-vstep{display:flex;gap:11px;position:relative;padding-bottom:18px}
.rd-vstep:last-child{padding-bottom:0}
.rd-vstep::before{content:'';position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--border);border-radius:2px}
.rd-vstep:last-child::before{display:none}
.rd-vstep.feito::before{background:var(--green)}
.rd-vstep .c{width:27px;height:27px;border-radius:99px;display:grid;place-items:center;flex-shrink:0;font-size:11.5px;
  font-weight:800;color:var(--text-faint);z-index:1;background:var(--slate-100);border:2px solid var(--border-def);
  transition:all .3s var(--rd-spring)}
.rd-vstep.ativo .c{background:var(--rd-grad-btn);border-color:transparent;color:#fff;transform:scale(1.12);
  box-shadow:0 3px 10px rgba(37,99,235,.4)}
.rd-vstep.feito .c{background:var(--green-bg);border-color:#86EFAC;color:var(--green)}
.rd-vstep .tx{padding-top:4px}
.rd-vstep .tt{font-size:12px;font-weight:800;color:var(--text-faint);transition:color .3s;display:block}
.rd-vstep.ativo .tt{color:var(--navy)}
.rd-vstep.feito .tt{color:var(--green)}
.rd-vstep .ss{font-size:10px;color:var(--text-faint);margin-top:2px;line-height:1.4;display:block}
.rd-resumo{background:var(--navy-50);border:1.5px solid rgba(37,99,235,.22);border-radius:var(--r);padding:13px 14px}
.rd-resumo .rt{font-size:9.5px;font-weight:800;color:var(--navy);letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px}
.rd-resumo .ri{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0}
.rd-resumo .ri span{color:var(--text-muted)}
.rd-resumo .ri b{color:var(--text);font-family:var(--mono);font-size:11px;text-align:right}
.rd-resumo .ri b.ok{color:var(--green)}
.rd-resumo .ri b.pend{color:var(--text-faint);font-weight:500}
.rd-pane{display:none}
.rd-pane.on{display:block;animation:fadeUp .3s var(--ease-out) both}

/* ── Chips de NF (parse ao vivo) ── */
.rd-nfchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rd-nfchip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:600;
  background:var(--navy-50);color:var(--navy);border:1px solid #BFDBFE;border-radius:99px;padding:3px 10px;
  animation:popIn .2s var(--rd-spring) both}
body.dark .rd-nfchip{border-color:#1E3A8A}
.rd-nfchip .x{border:none;background:none;color:var(--navy);cursor:pointer;font-size:10px;font-weight:800;
  padding:0 0 0 6px;opacity:.6;transition:opacity .15s}
.rd-nfchip .x:hover{opacity:1}

/* ── Nav lateral consolidada ── */
.rd-shell{display:grid;grid-template-columns:236px 1fr;gap:12px;align-items:start}
@media(max-width:720px){.rd-shell{grid-template-columns:1fr}}
.rd-nav{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:8px;
  box-shadow:var(--sh);display:flex;flex-direction:column;gap:1px;position:sticky;top:12px}
@media(max-width:720px){.rd-nav{position:static;flex-direction:row;flex-wrap:wrap}}
.rd-nav .grp{font-size:9px;font-weight:800;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase;padding:10px 10px 4px}
.rd-nav .grp:first-child{padding-top:4px}
.rd-nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;
  border-radius:8px;padding:8px 10px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;
  color:var(--text-muted);transition:background .15s,color .15s;white-space:nowrap}
.rd-nav-item:hover{background:var(--navy-50);color:var(--navy)}
.rd-nav-item.on{background:var(--rd-grad-btn);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(37,99,235,.30)}
.rd-nav-item .ic{width:18px;text-align:center;flex-shrink:0;font-size:13px}
.rd-subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rd-subtab{border:1.5px solid var(--border-def);background:var(--surface);border-radius:99px;padding:7px 14px;
  font-size:11.5px;font-weight:700;color:var(--text-muted);cursor:pointer;font-family:var(--font);transition:all .18s}
.rd-subtab:hover{border-color:var(--navy);color:var(--navy)}
.rd-subtab.on{background:var(--rd-grad-btn);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.35)}

/* ── Stats ── */
.rd-stats{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.rd-stats .box{flex:1;min-width:110px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:11px 13px;text-align:center;animation:fadeUp .3s var(--ease-out) both}
.rd-stats .v{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--navy)}
.rd-stats .v.verde{color:var(--green)}
.rd-stats .v.ambar{color:var(--amber)}
.rd-stats .v.verm{color:var(--red)}
.rd-stats .l{font-size:9.5px;font-weight:700;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

/* ── Sucesso overlay ── */
.rd-sucesso{display:none;position:fixed;inset:0;background:rgba(11,21,38,.55);z-index:9995;align-items:center;
  justify-content:center;padding:20px;animation:fadeIn .25s both}
.rd-sucesso.on{display:flex}
.rd-sucesso .box{background:var(--surface);border-radius:18px;padding:30px 26px;text-align:center;max-width:330px;
  width:100%;box-shadow:0 24px 60px rgba(11,21,38,.35);animation:popIn .35s var(--rd-spring) both}
.rd-sucesso .ico{width:60px;height:60px;border-radius:99px;margin:0 auto 14px;background:var(--green-bg);
  display:grid;place-items:center;font-size:28px;color:var(--green)}
.rd-sucesso .ico span{animation:rdCheckPop .45s .15s var(--rd-spring) both;display:inline-block}
.rd-sucesso h3{font-size:15px;font-weight:800;margin:0 0 6px;color:var(--text)}
.rd-sucesso p{font-size:12.5px;color:var(--text-muted);line-height:1.6;margin:0 0 16px}
.rd-sucesso .rd-btn{width:100%}

/* ── Switch ── */
.rd-switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0}
.rd-switch input{opacity:0;width:0;height:0}
.rd-switch .track{position:absolute;inset:0;background:var(--border-def);border-radius:99px;transition:background .2s;cursor:pointer}
.rd-switch .track::before{content:'';position:absolute;width:15px;height:15px;border-radius:99px;background:#fff;
  top:3px;left:3px;transition:transform .2s var(--rd-spring);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rd-switch input:checked + .track{background:var(--navy)}
.rd-switch input:checked + .track::before{transform:translateX(17px)}

/* ── Progresso ── */
.rd-prog{height:8px;border-radius:99px;background:var(--slate-100);overflow:hidden;margin:10px 0 6px}
.rd-prog .p{height:100%;width:0;border-radius:99px;background:var(--rd-grad-btn);transition:width .4s var(--ease-out)}

/* ── Empty state ── */
.rd-vazio{text-align:center;padding:36px 20px;color:var(--text-muted);animation:fadeIn .3s both}
.rd-vazio .ico{font-size:34px;margin-bottom:10px;opacity:.6}
.rd-vazio .t{font-size:13px;font-weight:700;color:var(--text-body);margin-bottom:4px}
.rd-vazio .s{font-size:11.5px;line-height:1.6}
</style>

<script>
/* ── rd-helpers compartilhados do redesign ── */
function rdLoading(id, sim) {
  var b = document.getElementById(id);
  if (b) { b.disabled = sim; b.classList.toggle('loading', sim); }
}
function rdSucesso(titulo, msg) {
  var s = document.getElementById('rd-sucesso');
  if (!s) { showToast(titulo + ' — ' + msg, 'ok'); return; }
  var t = document.getElementById('rd-suc-titulo'), m = document.getElementById('rd-suc-msg');
  if (t) t.textContent = titulo;
  if (m) m.textContent = msg;
  s.classList.add('on');
}
function rdFecharSucesso() {
  var s = document.getElementById('rd-sucesso');
  if (s) s.classList.remove('on');
}
/* wizard de 3 passos com trilho vertical (ids rd-vs1..3 + rd-p1..3) */
function rdPasso(n) {
  [1,2,3].forEach(function(i) {
    var st = document.getElementById('rd-vs' + i);
    if (!st) return;
    st.className = 'rd-vstep' + (i < n ? ' feito' : i === n ? ' ativo' : '');
    var c = st.querySelector('.c');
    if (c) c.textContent = i < n ? '✓' : i;
    var p = document.getElementById('rd-p' + i);
    if (p) p.classList.toggle('on', i === n);
  });
}
</script>
